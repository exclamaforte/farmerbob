# farmerbob source registry
# Every way of getting an agent to do work. Consumed by the adapter registry (adp-trait).
# NO SECRETS IN THIS FILE — keys live in ~/.config/farmerbob/secrets.env (0600).
#
# status: verified | blocked | unconfigured
# quota:  plan (free until a usage limit -> park & resume) | metered (billed per token)

# ---------------------------------------------------------------- native CLIs
[source.claude-sonnet]
status      = "disabled"
disabled_reason = """The five-hour window granted 2026-09-18T07:24Z expired at 12:24Z. Disabled
at 12:27Z, three minutes later, because fb-status.sh printed

    claude-sonnet: window EXPIRED 0h03m ago (...) -- STILL ENABLED -- DISABLE IT

on the first tick after the instant passed. The previous window ran 1h47m over and was caught
only by reading a clock; the expiry is machine-readable now and the ten-minute loop cannot miss
it. That is the whole difference, and it is the difference between a promise and a rule.

The window earned its slot. Inside it sonnet WON due-reset on a measured axis -- gut succeeded()
and its suite fails on three tests to gemini's two, in 253 lines to 324 for the same 45 -- and
on store-batch it wrote the critique that disqualified the best suite in the field, catching
three unnecessary pub(crate) edits in lib.rs that the path-level scope gate could not see.

Re-enabling is a one-word change plus a new expires_at. The standing reason to keep it off is
unchanged: the orchestrator runs on the same Anthropic plan, so every sonnet dispatch competes
with the adjudicator for one budget."""
# WINDOW: 2026-09-18T07:24Z -> EXPIRED 2026-09-18T12:24Z (owner instruction, fourth flip).
# expires_at kept below so fb-status keeps reporting the window's history rather than falling
# silent the moment it is honoured.
expires_at  = "2026-09-18T12:24:00+00:00"
# `expires_at` is read by fb-status.sh, which prints a WINDOW line on every run and shouts
# EXPIRED once the instant passes. The previous window ran 1h47m past its end because nothing
# surfaced it and I only noticed by reading a clock -- the entry predicted exactly that and
# called it the bug. Now the loop that runs every ten minutes cannot miss it.
#
# The standing reason to keep this arm off is unchanged and still true: the orchestrator runs
# on the same Anthropic plan, so every sonnet dispatch competes with the adjudicator for one
# budget. A weekly reset was consumed that way once, largely by this arm at 14 waves in a day.
# The window is the containment.
#
# It earns its slot when it has one. Two tasks inside the last window, and it WON due-reset on
# a measured axis: gut succeeded() and its suite fails on three tests against gemini's two, in
# 253 lines to gemini's 324 for the same 45 tests.
kind        = "cli"
cmd         = "claude"
args        = ["-p", "{prompt}", "--permission-mode", "bypassPermissions",
               "--model", "sonnet", "--effort", "xhigh", "--output-format", "json"]
reasoning   = "xhigh"   # user instruction 2026-09-17
notes       = """RE-ENABLED 2026-09-17 by user instruction, reversing the 2026-09-16 instruction
that disabled it. The original reason was real and is worth keeping written down: the
orchestrator runs on the same Anthropic plan, so dispatching sonnet competes with it for the
same token budget. It was re-enabled knowing that, with a weekly plan reset about 18 hours out,
so the competition is bounded and the spare capacity is worth more than the headroom.
This is a DECISION, not a fix. If the plan tightens, change this line and not the router:
router::eligibility reads status from here on every selection, so the constraint lives in the
registry rather than in whatever the orchestrator happens to remember.
Effort raised to xhigh at the same time. Unlike codex this could NOT be verified from here.
The claude CLI reported thinking_tokens: 0 at both --effort low and --effort xhigh on a problem
both solved, so no behavioural difference was demonstrable. Worse, an unrecognised --effort is
NOT an error: it prints "Warning: Unknown --effort value ... using the default effort" and
proceeds, so a typo here yields a full confident run at default effort while the registry claims
xhigh. Valid set, from --help: low, medium, high, xhigh, max. That warning goes to stderr and
nothing here reads it."""
cwd_honored = true
model       = "claude-sonnet-5"
provider    = "anthropic"
quota       = "plan"
context     = 1000000
max_output  = 64000
# Richest accounting of any source: costUSD, per-model token split incl. cache, num_turns, ttft.
accounting  = "full"
reference   = true          # adapter all others are validated against

[source.codex-luna]
status      = "verified"
kind        = "cli"
cmd         = "codex"
args        = ["exec", "--dangerously-bypass-approvals-and-sandbox", "--strict-config",
               "-c", "model_reasoning_effort=\"xhigh\"",
               "-m", "gpt-5.6-luna", "{prompt}"]
reasoning   = "xhigh"   # user instruction 2026-09-17; see notes

cwd_honored = true
model       = "gpt-5.6-luna"
provider    = "openai-chatgpt-plan"
quota       = "plan"
accounting  = "tokens-only"  # emits "tokens used", no dollar cost
notes       = """auth_mode=chatgpt, OPENAI_API_KEY null -> plan limit, not billing.
Reasoning effort raised to xhigh on 2026-09-17 by user instruction. Passed PER INVOCATION via
-c rather than by editing ~/.codex/config.toml, so the user's own interactive codex sessions
keep their own setting (medium) and farmerbob cannot silently change them.
--strict-config is part of the same change and is the load-bearing half: without it an
unrecognised config key is accepted and ignored, so a typo here would run every arm at the
default effort while the registry claimed xhigh, and nothing would say so. Verified that the
value is really validated -- model_reasoning_effort="banana" is refused with HTTP 400, so
"xhigh" being accepted and completing is evidence rather than silence.
PRO IS NOT AVAILABLE HERE. gpt-5.6-luna-pro returns "not supported when using Codex with a
ChatGPT account" (400). The only pro route is or-luna-pro over OpenRouter, which is parked as
redundant and whose key is at its cap. xhigh on the base model is the most thinking this arm
can be given."""

[source.gemini-38-flash]
status      = "verified"
kind        = "cli"
cmd         = "agy"
args        = ["-p", "{prompt}", "--print-timeout", "45m",
               "--model", "gemini-3.8-flash-high",
               "--add-dir", "{worktree}", "--dangerously-skip-permissions",
               "--output-format", "text"]
cwd_honored = false          # !! MUST pass --add-dir or it writes to its own scratch dir
model       = "gemini-3.8-flash-high"
# These args now match fb-dispatch.sh's launch line, which is what actually runs. They did
# not: the registry said -low and stream-json while the dispatcher has always sent -high and
# text. Nothing read the difference, so nothing reported it, and the registry was describing
# an arm that never ran. -high is the implementer tier, meant to sit alongside codex-luna at
# xhigh and glm-53-flash rather than below them.
provider    = "google-oauth"
quota       = "plan"
quota_bucket = "google-oauth-exclamaforte"   # possibly shared with the `gemini` CLI — unconfirmed
# UNPARKED 2026-09-17T21:40Z. Was parked_until 2026-09-22T19:07Z on:
#   "error: Individual quota reached. Please upgrade your subscription to increase your limits.
#    Resets in 153h54m42s." -- observed 2026-09-16T09:12Z on three runs (bandit-route, crossx,
#    defect-sens), each of which the harness scored NO-OP. A quota block is not an arm failure;
#    those three are reclassified quota_limited and excluded from the posterior. (farmerbob-h04)
# The subscription was upgraded, which is exactly what that message asked for, so the reset
# instant it stated no longer applies. Probed directly rather than assumed: `agy -p ... --model
# gemini-3.1-pro-high` returned a completion at 21:39Z, five days before the stated reset.
#
# A park is a claim about the future and an upgrade falsifies it. Nothing in the harness
# notices that, so this is a hand edit; farmerbob-core::quota::park_after decides when to SET
# a park and nothing yet decides when one has been invalidated early.
notes       = """`agy models` at 1.2.4, confirmed 2026-09-17, fourteen routes:
  gemini-3.8-flash-{high,medium,low}
  gemini-3.7-flash-{high,medium,low}
  gemini-3.6-flash-{high,medium,low}
  gemini-3.1-pro-{high,low}       <- PRO. No pro-tier route has ever been wired as an arm.
  claude-sonnet-4-6               (thinking)
  claude-opus-4-6-thinking
  gpt-oss-120b-medium
The two Claude routes bill to google-oauth, not to the Anthropic account, so they do not
compete with the orchestrator for tokens the way claude-sonnet did. That is an observation,
not a decision: they stay unwired until the owner says otherwise."""

