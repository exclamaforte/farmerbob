[source.ifm-k2-think]
status     = "disabled"
disabled_reason = """Retired 2026-09-18 for burning slots on refusals. Across waves 55-62 it
produced FOUR of the eleven duds, more than any other arm. Nine of those eleven were quota
refusals rather than capability failures and this arm was the largest single source: every
recent dispatch ended NO-OP at rc=1 in 8-10 seconds, which is the ifm daily token cap refusing
it before it started, not the arm failing a task.

ifm-k2-horizon stays. It shares the account and will meet the same cap, but it is the half of
the pair kept by owner instruction and it has passed.

Re-enable when the ifm daily cap is known to have rolled, and preferably once
quota::park_after is wired into dispatch, so a refusal parks the arm instead of costing a slot
in every wave. Verified-in-all-but-status: the launcher, the shim and the probe all worked
(PASSED in 23s), so re-enabling is a one-word change back to status = "verified"."""
# was: status = "verified"   # multi-turn works via shims/ifm-proxy.py; PASSED the probe in 23s
kind       = "opencode"
launcher   = "opencode"   # NOT `ori opencode` -- ori replaces the env and drops IFM_API_KEY
model      = "ifm/IFM/K2-Think-v2"
provider   = "ifm"
quota      = "metered"
key_env    = "IFM_API_KEY"
multiturn  = true   # via the shim only
notes      = """Wrote the file correctly, then the FOLLOWING turn failed: \
'messages.2.assistant.reasoning_content: property is unsupported' (wrong_api_format). \
opencode replays the assistant reasoning field and IFM's endpoint rejects it, so any \
task needing more than one turn breaks. Also mangled an absolute path in an earlier run \
(transcribed one digit of a directory name wrong), which opencode correctly rejected as \
an external directory. Prefer relative paths in prompts for this model."""

