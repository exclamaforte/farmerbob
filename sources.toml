# farmerbob source registry
# Every way of getting an agent to do work. Consumed by the adapter registry (adp-trait).
# NO SECRETS IN THIS FILE — keys live in ~/.config/farmerbob/secrets.env (0600).
#
# status: verified | blocked | unconfigured
# quota:  plan (free until a usage limit -> park & resume) | metered (billed per token)

# ---------------------------------------------------------------- native CLIs
[source.claude-sonnet]
status      = "verified"
kind        = "cli"
cmd         = "claude"
args        = ["-p", "{prompt}", "--permission-mode", "bypassPermissions",
               "--model", "sonnet", "--output-format", "json"]
cwd_honored = true
model       = "claude-sonnet-5"
provider    = "anthropic"
quota       = "plan"
context     = 1000000
max_output  = 64000
# Richest accounting of any source: costUSD, per-model token split incl. cache, num_turns, ttft.
accounting  = "full"
reference   = true          # adapter all others are validated against

[source.codex-luna]
status      = "verified"
kind        = "cli"
cmd         = "codex"
args        = ["exec", "--dangerously-bypass-approvals-and-sandbox", "-m", "gpt-5.6-luna", "{prompt}"]
cwd_honored = true
model       = "gpt-5.6-luna"
provider    = "openai-chatgpt-plan"
quota       = "plan"
accounting  = "tokens-only"  # emits "tokens used", no dollar cost
notes       = "auth_mode=chatgpt, OPENAI_API_KEY null -> plan limit, not billing"

[source.gemini-38-flash]
status      = "verified"
kind        = "cli"
cmd         = "agy"
args        = ["-p", "{prompt}", "--model", "gemini-3.8-flash-low",
               "--add-dir", "{worktree}", "--dangerously-skip-permissions",
               "--output-format", "stream-json"]
cwd_honored = false          # !! MUST pass --add-dir or it writes to its own scratch dir
model       = "gemini-3.8-flash"
provider    = "google-oauth"
quota       = "plan"
quota_bucket = "google-oauth-exclamaforte"   # possibly shared with the `gemini` CLI — unconfirmed
notes       = "agy also exposes 3.7/3.6-flash, 3.1-pro, claude-sonnet-4-6, claude-opus-4-6, gpt-oss-120b"

[source.glm-53-flash]
status      = "verified"
kind        = "cli"
cmd         = "zcode"
args        = ["--prompt", "{prompt}"]
model       = "GLM-5.3-Flash"
model_ref   = "zai/glm-5.3-flash"
provider    = "zai-coding-plan"
quota       = "plan"
context     = 1000000
max_output  = 128000
launcher    = "zcode"

# ------------------------------------------------- API-keyed, via opencode
[source.ifm-k2-horizon]
status     = "verified"   # multi-turn works VIA shims/ifm-proxy.py (injects the required reasoning field)
kind       = "opencode"
launcher   = "opencode"   # NOT `ori opencode` -- ori replaces the env and drops IFM_API_KEY
model      = "ifm/IFM/K2-Horizon-375B-A23B"
provider   = "ifm"
quota      = "metered"
base_url   = "https://api.ifm.ai/v1"
key_env    = "IFM_API_KEY"
multiturn  = true   # only through the shim; direct opencode -> IFM is still broken
shim       = "shims/ifm-proxy.py"
notes      = "vLLM-backed. IFM requires a `reasoning` field on every replayed assistant message; opencode omits it, so the shim injects it. Verified: PASSED gpu-lease, 552 lines, 41 requests patched."

[source.ifm-k2-think]
status     = "verified"      # multi-turn works via shims/ifm-proxy.py; PASSED the probe in 23s
kind       = "opencode"
launcher   = "opencode"   # NOT `ori opencode` -- ori replaces the env and drops IFM_API_KEY
model      = "ifm/IFM/K2-Think-v2"
provider   = "ifm"
quota      = "metered"
key_env    = "IFM_API_KEY"
multiturn  = true   # via the shim only
notes      = """Wrote the file correctly, then the FOLLOWING turn failed: \
'messages.2.assistant.reasoning_content: property is unsupported' (wrong_api_format). \
opencode replays the assistant reasoning field and IFM's endpoint rejects it, so any \
task needing more than one turn breaks. Also mangled an absolute path in an earlier run \
(transcribed one digit of a directory name wrong), which opencode correctly rejected as \
an external directory. Prefer relative paths in prompts for this model."""

# ---------------------------------------------------------------- OpenRouter
# Launched via `ori opencode` -- ori injects the OpenRouter credential from
# ~/.ori/credentials.json. NOTE: ori REPLACES the environment, so IFM cannot be
# launched through it; IFM uses plain `opencode` with IFM_API_KEY exported.
# Prices are $/1M tokens, in/out, read from the OpenRouter catalogue 2026-09-15.
# Slugs marked (!) diverge from the shorthand originally requested — see bead farmerbob-h2k.
[source.or-gemini-38-flash]
status = "disabled"
kind = "opencode"
launcher = "ori opencode"
provider = "openrouter"
quota = "metered"
model  = "openrouter/google/gemini-3.8-flash"
price_in = 0.750
price_out = 3.750                            # (!) requested as "5.8 flash"; no 5.8 exists
quota_bucket = "google"   # the upstream vendor is what rate-limits, not openrouter
redundant_with = "gemini-38-flash"   # same model via a free route; prefer that unless comparing routes
disabled_reason = "paid duplicate of the free arm gemini-38-flash; identical model"

