[workspace]
resolver = "3"
members = [
    "crates/farmerbob-core",
    "crates/farmerbob-store",
    "crates/farmerbobd",
    "crates/fb",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
farmerbob-core  = { path = "crates/farmerbob-core" }
farmerbob-store = { path = "crates/farmerbob-store" }

anyhow     = "1"
thiserror  = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
toml       = "0.9"
clap       = { version = "4", features = ["derive", "env"] }
rusqlite   = { version = "0.37", features = ["bundled", "chrono"] }
tokio      = { version = "1", features = ["full"] }
chrono     = { version = "0.4", features = ["serde"] }
uuid       = { version = "1", features = ["v4", "serde"] }
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
